name: CI/CD Docker

on:
    push:
        branches:
            - main

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - name: Checkout
              uses: actions/checkout@v3

            - name: Compute image name
              id: meta
              run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.image }}:latest

    deploy:
        needs: build-and-push
        runs-on: ubuntu-latest
        steps:
            - name: Deploy to server
              uses: appleboy/ssh-action@master
              with:
                  host: ${{ secrets.HOST }}
                  username: root
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  port: 22
                  script: |
                      if [ ! -d "yummystatus" ]; then
                        git clone https://github.com/${{ github.repository }}.git yummystatus
                      fi
                      cd yummystatus
                      git reset --hard HEAD
                      git pull
                      if ! command -v docker >/dev/null 2>&1; then
                        echo "Docker not found, installing via get.docker.com"
                        curl -fsSL https://get.docker.com | sh
                        systemctl enable --now docker
                      fi
                      echo "DB_USER=${{ secrets.DB_USER }}" > .env
                      echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
                      echo "GLOBALPING_API_KEY=${{ secrets.GLOBALPING_API_KEY }}" >> .env
                      echo "GLOBALPING_API_KEY2=${{ secrets.GLOBALPING_API_KEY2 }}" >> .env
                      echo "GLOBALPING_API_KEY3=${{ secrets.GLOBALPING_API_KEY3 }}" >> .env
                      echo "GLOBALPING_API_KEY4=${{ secrets.GLOBALPING_API_KEY4 }}" >> .env
                      echo "GLOBALPING_API_KEY5=${{ secrets.GLOBALPING_API_KEY5 }}" >> .env
                      echo "GLOBALPING_API_KEY6=${{ secrets.GLOBALPING_API_KEY6 }}" >> .env
                      echo "GLOBALPING_SECRET_KEY=${{ secrets.GLOBALPING_SECRET_KEY }}" >> .env
                      echo "PSI_API_KEY=${{ secrets.PSI_API_KEY }}" >> .env
                      echo "TG_BOT_TOKEN=${{ secrets.TG_BOT_TOKEN }}" >> .env
                      echo "TG_CHAT_ID=${{ secrets.TG_CHAT_ID }}" >> .env
                      sudo docker system prune -a -f || true
                      
                      echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
                      export IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr 'A-Z' 'a-z')"
                      docker compose pull
                      docker compose up -d
